<title>CRAFTER MAHIM • Official</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#020305;color:#fff;font-family:Inter,Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
.page{
  min-height:100vh; position:relative; isolation:isolate;
  background:
    linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.68)),
    url("background.jpg") center/cover fixed no-repeat;
}
.page:before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(circle at 50% 20%,rgba(0,255,240,.13),transparent 25%),
   radial-gradient(circle at 8% 72%,rgba(255,0,120,.11),transparent 24%),
   radial-gradient(circle at 92% 58%,rgba(0,130,255,.12),transparent 23%);
}
.rgb{
 position:fixed;width:310px;height:310px;border-radius:50%;filter:blur(85px);
 opacity:.28;z-index:-1;pointer-events:none;animation:rgb 9s linear infinite;
}
.rgb.one{left:-140px;top:12%}.rgb.two{right:-140px;bottom:7%;animation-delay:-4.5s}
@keyframes rgb{
 0%{background:#00fff0;transform:translate(0,0)}
 25%{background:#087cff;transform:translate(70px,40px)}
 50%{background:#a900ff;transform:translate(0,90px)}
 75%{background:#ff006a;transform:translate(-70px,40px)}
 100%{background:#00fff0;transform:translate(0,0)}
}
.shell{width:min(100%,720px);margin:auto;padding:28px 14px 34px}
.hero{text-align:center}
.avatar{
 width:154px;height:154px;margin:0 auto 13px;padding:5px;border-radius:50%;
 background:conic-gradient(#00fff0,#167cff,#ff19c8,#ffc400,#00fff0);
 box-shadow:0 0 22px #00fff077,0 0 50px #007cff33;
 animation:hue 6s linear infinite;
}
.avatar img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;border:5px solid #05080c}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.name{
 font-size:clamp(34px,8vw,58px);line-height:.95;font-weight:950;letter-spacing:1px;
 text-shadow:0 3px 0 #000,0 0 22px #00fff044;margin:0
}
.verified{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;
 background:#159cff;box-shadow:0 0 15px #159cff99;font-size:14px;vertical-align:middle}
.tag{
 margin:10px 0 20px;color:#e1e7ed;font-size:12px;font-weight:700;letter-spacing:2.4px
}

/* Poster-like social cards: no external logo images are used. */
.links{display:grid;gap:13px;position:relative}
.link{
 --c:#00fff0;position:relative;display:flex;align-items:center;min-height:76px;
 padding:8px 11px 8px 8px;text-decoration:none;color:#fff;border-radius:22px;
 background:linear-gradient(100deg,rgba(4,8,13,.88),rgba(9,17,23,.56));
 border:1px solid color-mix(in srgb,var(--c) 70%,transparent);
 box-shadow:inset 0 0 20px color-mix(in srgb,var(--c) 12%,transparent),
             0 0 18px color-mix(in srgb,var(--c) 16%,transparent);
 overflow:hidden;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;
}
.link:before{
 content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);
 box-shadow:0 0 22px var(--c)
}
.link:after{
 content:"";position:absolute;top:0;bottom:0;width:90px;left:-120px;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
 transform:skewX(-20deg);transition:.45s
}
.link:hover{transform:translateY(-3px) scale(1.012);filter:brightness(1.13);
 box-shadow:inset 0 0 25px color-mix(in srgb,var(--c) 16%,transparent),
             0 12px 30px #0009,0 0 28px color-mix(in srgb,var(--c) 30%,transparent)}
.link:hover:after{left:110%}
.icon{
 flex:0 0 58px;width:58px;height:58px;border-radius:18px;margin-right:14px;
 display:grid;place-items:center;background:linear-gradient(145deg,#101a22,#05080c);
 border:1px solid color-mix(in srgb,var(--c) 75%,transparent);
 box-shadow:0 0 20px color-mix(in srgb,var(--c) 35%,transparent),inset 0 0 15px #fff1;
}
.icon svg{width:31px;height:31px;fill:currentColor}
.info{flex:1;min-width:0}.info strong{display:block;font-size:18px;line-height:1.05}
.info span{display:block;margin-top:6px;font-size:12px;color:#bfc8d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{
 width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
 font-size:30px;font-weight:300;color:var(--c);
 border:1px solid color-mix(in srgb,var(--c) 55%,transparent);
 background:#050a0f99;box-shadow:0 0 14px color-mix(in srgb,var(--c) 25%,transparent)
}
.tiktok{--c:#ff2c7d}.discord{--c:#7289ff}.telegram{--c:#18bfff}.youtube{--c:#ff263f}.freefire{--c:#ffb000}
.quote{
 text-align:center;margin:25px 0 8px;font-size:17px;font-weight:900;letter-spacing:3px;
 text-transform:uppercase;text-shadow:0 0 16px #00fff077
}
.quote:before,.quote:after{content:"◆";font-size:8px;color:#ffc400;margin:0 13px;vertical-align:middle}
.footer{text-align:center;color:#aab3bd;font-size:10px;letter-spacing:1.3px;margin-top:15px}
@media(max-width:480px){
 .shell{padding:18px 11px 25px}.avatar{width:128px;height:128px}.link{min-height:68px;border-radius:19px}
 .icon{width:51px;height:51px;flex-basis:51px;margin-right:11px}.icon svg{width:28px;height:28px}
 .info strong{font-size:16px}.go{width:35px;height:35px}
}
</style>
